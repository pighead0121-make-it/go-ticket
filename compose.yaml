services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user 
      POSTGRES_PASSWORD: password 
      POSTGRES_DB: ticket_db 
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management-alpine 
    environment:
      RABBITMQ_DEFAULT_USER: guest 
      RABBITMQ_DEFAULT_PASS: guest 
    ports:
      - "5672:5672"
      - "15672:15672"